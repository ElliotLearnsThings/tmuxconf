# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Create a new session with prefix+S
bind-key S command-prompt -p "New session name:" "new-session -s '%%'"

bind-key C-j switch-client -n  # next session
bind-key C-k switch-client -p  # previous session

# Set prefix to Ctrl-a (similar to screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable vi mode keys
setw -g mode-keys vi

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 10
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 10

# Vim-style copy mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Split panes using | and -
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind-key x kill-pane

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Enable mouse mode
set -g mouse on

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin "arcticicestudio/nord-tmux"

set -g @resurrect-capture-pane-contents 'on'
set -g default-command ""

# for neovim
set -g @resurrect-strategy-nvim 'session'

# Theme-specific settings
# Dracula settings
#set -g @dracula-show-powerline true
#set -g @dracula-show-left-icon session
#set -g @dracula-plugins "cpu-usage ram-usage time"

# Catppuccin settings (uncomment when using)
#set -g @catppuccin_flavour 'latte' # latte, frappe, macchiato, mocha
#set -g @catppuccin_window_tabs_enabled on

# Tmux-power settings (uncomment when using)
set -g @tmux_power_theme 'gold'

# Status line plugin (choose one)
#set -g @plugin 'jimeh/tmux-themepack'
#set -g @themepack 'powerline/default/blue' # or try 'powerline/block/cyan'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
