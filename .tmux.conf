# ~/.tmux.conf — native, no TPM. Palette: Tokyo Night (Omarchy default)

# ── Terminal ─────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'      # undercurl
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g default-shell /usr/bin/zsh

# ── Sensible defaults (what tmux-sensible did) ───────────────
set -sg escape-time 10
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 5
set -g focus-events on
set -g set-clipboard on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
setw -g mode-keys vi
set -g status-keys emacs

# ── Prefix ───────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Sessions ─────────────────────────────────────────────────
bind S command-prompt -p "New session name:" "new-session -s '%%'"
bind C-j switch-client -n
bind C-k switch-client -p
bind s choose-tree -Zs

# ── Panes ────────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 10
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 10
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind x kill-pane
bind c new-window -c "#{pane_current_path}"
bind z resize-pane -Z

# ── Copy mode ────────────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ── Style ────────────────────────────────────────────────────
# bg #1a1b26  surface #292e42  fg #c0caf5  muted #565f89
# blue #7aa2f7  magenta #bb9af7  cyan #7dcfff  green #9ece6a  yellow #e0af68
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=#565f89"
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#{?client_prefix,#[fg=#1a1b26 bg=#e0af68 bold],#[fg=#1a1b26 bg=#7aa2f7 bold]} #S #[default]  "
set -g status-right "#{?window_zoomed_flag,#[fg=#e0af68]zoom  ,}#[fg=#565f89]#{=/-30/…:pane_current_path}  #[fg=#7aa2f7]%H:%M "

setw -g window-status-format "#[fg=#565f89] #I #W "
setw -g window-status-current-format "#[fg=#c0caf5 bg=#292e42 bold] #I #W "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#e0af68"

set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-lines single
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g message-command-style "bg=#292e42,fg=#c0caf5"
setw -g mode-style "bg=#33467c,fg=#c0caf5"
setw -g clock-mode-colour "#7aa2f7"
set -g display-panes-active-colour "#7aa2f7"
set -g display-panes-colour "#565f89"

# machine-local overrides
if-shell "test -f ~/.tmux.local.conf" "source ~/.tmux.local.conf"
